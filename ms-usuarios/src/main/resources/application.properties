spring.application.name=ms-usuarios
server.port=8081

# Conexión a Laragon
spring.datasource.url=jdbc:mysql://localhost:3306/db_usuarios?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Logs (Ajustado a tu paquete de usuarios)
logging.level.com.dsy1103.msusuarios=DEBUG
logging.file.name=logs/ms-usuarios.log