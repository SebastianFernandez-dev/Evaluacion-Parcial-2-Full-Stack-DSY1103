spring:
  application:
    name: ms-usuarios-dev
  datasource:
    url: jdbc:mysql://localhost:3306/prueba1?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: true

server:
  port: 8081

logging:
  level:
    root: INFO
    com.dsy1103.msusuarios: DEBUG
  file:
    name: logs/ms-usuarios-dev.log