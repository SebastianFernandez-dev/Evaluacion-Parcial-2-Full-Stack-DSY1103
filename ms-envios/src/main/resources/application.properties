spring.application.name=ms-envios
server.port=8086

#Configuración de persistencia (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/prueba5?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Configuración de Liquibase
spring.liquibase.change-log=classpath:db/changelog.sql

#Configuración JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.generate_statistics=true

#Configuración de logs (SLF4J)
logging.level.root=INFO
logging.level.com.dsy1103.msenvios=DEBUG
logging.file.name=logs/ms-envios.log
logging.pattern.console=%d{yyyy-MM-dd HH-mm-ss} %-5level [%thread] %logger{36} - %msg%n