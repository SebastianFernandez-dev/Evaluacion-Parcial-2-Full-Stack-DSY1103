spring.application.name=ms-reportes
server.port=8090

#Configuración de persistencia (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/prueba7?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Configuración JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.generate_statistics=true

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

#Configuración de logs (SLF4J)
logging.level.root=INFO
logging.level.com.dsy1103.msproveedores=DEBUG
logging.file.name=logs/ms-proveedores.log
logging.pattern.console=%d{yyyy-MM-dd HH-mm-ss} %-5level [%thread] %logger{36} - %msg%n