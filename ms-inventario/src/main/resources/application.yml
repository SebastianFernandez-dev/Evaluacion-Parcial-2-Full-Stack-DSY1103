server:
  port: 8083

spring:
  application:
    name: INVENTARIO-SERVICE
  profiles:
    active: dev

  #Configuracion JPA/Hibernate GLOBAL
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true

  #Configuracion Flyway GLOBAL
  flyway:
    enabled: true
    baseline-on-migrate: true

#Configuracion de logs (SLF4J)
logging:
  level:
    root: INFO
    com.dsy1103.msinventario: DEBUG
  file:
    name: logs/ms-inventario.log
  pattern:
    console: "%d{yyyy-MM-dd HH-mm-ss} %-5level [%thread] %logger{36} - %msg%n"

#Configuracion Swagger
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /doc/swagger-ui.html

#Configuracion Eureka
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

#Activacion de Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true