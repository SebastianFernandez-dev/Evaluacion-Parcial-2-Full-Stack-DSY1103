spring.application.name=ms-pedidos
server.port=8084

# Conexión a Laragon
spring.datasource.url=jdbc:mysql://localhost:3306/prueba4?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Activar Flyway
spring.flyway.enabled=true
# Esto permite que Flyway limpie la base de datos si es necesario (solo para desarrollo)
spring.flyway.baseline-on-migrate=true
# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Logs (Ajustado a tu paquete de usuarios)
logging.level.com.dsy1103.msusuarios=DEBUG
logging.file.name=logs/ms-usuarios.log