spring.application.name=ms-empleados
server.port=8089

spring.datasource.url=jdbc:mysql://localhost:3306/prueba6
spring.datasource.username=root
spring.datasource.password=
spring.datasource.drive-Class-name=com.mysql.cj.jdbc.Driver

sucursal.service.url=http://localhost:8088

spring.jpa.hibernate,ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.generate_statistics=true

spring.liquibase.enable=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

logging.level.root=INFO
logging.level.com.dsy1103.msempledos=DEBUG
logging.file.name=logs/ms-empledos.log
logging.pattern.console=%d{yyyy-MM-dd HH-mm-ss} %-5level [%thread] %logger{36} - %msg%n