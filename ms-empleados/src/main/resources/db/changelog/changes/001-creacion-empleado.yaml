databaseChangeLog:
  - changeSet:
      id: 001
      author: Sebas-Fernandez
      changes:
        - createTable:
            tableName: empleado
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: primer_nombre
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: segundo_nombre
                  type: VARCHAR(20)
              - column:
                  name: primer_apellido
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: segundo_apellido
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: cargo
                  type: VARCHAR(60)
                  constraints:
                    nullable: false
              - column:
                  name: rut
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: dv_rut
                  type: VARCHAR(1)
                  constraints:
                    nullable: false
              - column:
                  name: correo_empleado
                  type: VARCHAR(80)
                  constraints:
                    nullable: false
              - column:
                  name: fecha_ingreso
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: activo_empleado
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: sucursal_id
                  type: BIGINT
                  constraints:
                    nullable: false